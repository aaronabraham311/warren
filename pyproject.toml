[project]
name = "warren"
version = "0.1.0"
description = "AI-powered stock analysis agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic",
    "yfinance",
    "requests",
    "pydantic>=2",
    "streamlit",
    "python-dotenv",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-recording",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
