[project]
name = "warren"
version = "0.1.0"
description = "AI-powered stock analysis agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic",
    "yfinance",
    "requests",
    "pydantic>=2",
    "streamlit",
    "python-dotenv",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "finnhub-python>=2.4.28",
    "pyyaml>=6.0.3",
    "pypdf>=6.14.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-recording",
    "ruff",
    "mypy",
    "pre-commit>=4.6.0",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
disallow_any_explicit = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pydantic v2 BaseModel subclasses inherit internal Any annotations (e.g. __pydantic_extra__)
# which mypy reports as explicit-any — this is a known false positive, not our code.
module = [
    "agent.models",
    "agent.loop",
    "agent.portfolio",
    "agent.tools.base",
    "agent.tools.quote",
    "agent.tools.fundamentals",
    "agent.tools.growth",
    "agent.tools.filings",
    "data_sources.filing_models",
    "agent.tools.news",
    "agent.tools.screen",
    "agent.tools.holdings",
    "agent.tools.valuation",
    "agent.tools.valuation_history",
    "agent.tools.peers",
    "agent.tools.quality",
    "agent.tools.insider",
    "agent.tools.financial_strength",
    "agent.tools.intrinsic_value",
    "agent.tools.adverse_media",
    "agent.tools.capital_allocation",
    "agent.tools.persons",
    "agent.tools.watchlists",
    "eval.golden_set",
    "eval.grader",
    "eval.judge",
    "data_sources.gdelt_client",
    "data_sources.ofac_client",
    "data_sources.yfinance_client",
    "data_sources.edgar_client",
    "data_sources.finnhub_client",
]
disallow_any_explicit = false
