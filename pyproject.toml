[project]
name = "warren"
version = "0.1.0"
description = "AI-powered stock analysis agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic",
    "yfinance",
    "requests",
    "pydantic>=2",
    "streamlit",
    "python-dotenv",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-recording",
    "ruff",
    "mypy",
    "pre-commit>=4.6.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
disallow_any_explicit = true
warn_unreachable = true
