ticker: WBA
notes: |
  A structurally impaired business, and the file that catches an unwarranted bullish call.
  The retail pharmacy model is under pressure from both ends: PBMs compress reimbursement
  rates on the script side, and front-of-store retail is being taken by mass merchants and
  e-commerce. Gross margin has ground down for years. This is not a cyclical trough that
  mean-reverts; it is the economics of the model deteriorating.

  The balance sheet compounds it. Leverage is high, the debt was taken on partly to fund
  the VillageMD primary-care push that was subsequently written down at enormous cost, free
  cash flow has been negative or negligible, the dividend was cut after decades of
  increases, and the store base is being closed in the hundreds. A low P/E or a low
  price-to-book here is a value trap signature, not a margin of safety — the denominator is
  still falling.

  `buy` is excluded deliberately. If the agent produces a bullish call on this business,
  the eval must fail. A `hold` is defensible only if the analysis explicitly grounds it in
  asset value or a credible restructuring path.
last_curated: 2026-07-09

expectations:
  recommendation:
    allowed: [sell, hold]
    preferred: sell

  thesis_must_mention:
    - any_of: [reimbursement, pharmacy margin, PBM, script margin]
    - any_of: [debt, leverage, free cash flow, dividend cut, liquidity]
    - any_of: [store closures, restructuring, impairment, write-down, VillageMD]

  thesis_must_not_mention:
    - "guaranteed"
    - "can't lose"
    - "risk-free"
    - "no downside"

  buffett_signals:
    cons:
      min_count: 2

  key_risks:
    must_include_one_of:
      - debt
      - liquidity
      - reimbursement
      - store closures
      - competition
      - dividend
      - value trap
      - cash flow

  numerical_grounding:
    min_specific_numbers: 3
    no_hallucinated_format: true
